version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  order-service:
    build:
      context: ./order-service
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://postgres:admin@db:5432/order_db?sslmode=disable
      - PAYMENT_GRPC_URL=payment-service:50051
    depends_on:
      - db
      - payment-service

  payment-service:
    build:
      context: ./payment-service
    ports:
      - "8081:8081"
      - "50051:50051"
    environment:
      - DATABASE_URL=postgres://postgres:admin@db:5432/payment_db?sslmode=disable
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - db
      - rabbitmq

  notification-service:
    build:
      context: ./notification-service
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - rabbitmq

volumes:
  postgres_data:
